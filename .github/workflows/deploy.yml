name: Build image

on:
  push:
    branches:
      - main
    tags:
      - "**"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.juanmadiaz.com
  IMAGE_NAME: apps/comanditabot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Prepare image tags
        id: image-tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          tags=("${image}:${GITHUB_SHA}")

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            tags+=("${image}:main")
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME//\//-}"
            tags+=("${image}:${tag}")
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "release" && -n "${RELEASE_TAG:-}" ]]; then
            tag="${RELEASE_TAG//\//-}"
            tags+=("${image}:${tag}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}" | awk '!seen[$0]++'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            requirements=pro
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-infra:
    needs: build
    if: >
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - id: infra-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.K8S_INFRA_APP_ID }}
          private-key: ${{ secrets.K8S_INFRA_APP_PRIVATE_KEY }}
          owner: torgus
          repositories: k8s-infra

      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.infra-token.outputs.token }}
          script: |
            const tag = context.payload.release?.tag_name ??
              context.ref.replace("refs/tags/", "");

            await github.rest.repos.createDispatchEvent({
              owner: "torgus",
              repo: "k8s-infra",
              event_type: "image-published",
              client_payload: {
                app: "comanditabot",
                tag,
              },
            });
